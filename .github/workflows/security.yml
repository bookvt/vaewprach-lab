# Security checks for every PR and push to main.
# Job IDs (gitleaks, zizmor, sops-check) are required status checks in the
# main Ruleset (.github/rulesets/main.json) — do not rename without updating it.
# No `paths` filter on purpose: a required check must run on every PR.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # Monday 02:00 UTC — catch newly-added gitleaks rules
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the diff
          persist-credentials: false
      - name: Scan full git history
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --no-banner

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        run: pipx run zizmor==1.32.0 --format=github .github/workflows

  sops-check:
    name: sops-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the checker
        run: |
          bash scripts/tests/check-sops-encrypted.test.sh
          bash scripts/tests/gitignore.test.sh
      - name: Check every *.sops.* file is encrypted
        run: bash scripts/check-sops-encrypted.sh
